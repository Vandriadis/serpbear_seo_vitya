services:
  serpbear:
    build: .
    image: serpbear-company:local
    container_name: serpbear
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    # Prefer USER_NAME=admin in .env (do not use USER= — Linux USER overrides it)
    volumes:
      - serpbear_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/',(r)=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  serpbear_data:
