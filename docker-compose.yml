services:
  serpbear:
    build: .
    image: serpbear-company:local
    container_name: serpbear
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    # Prefer USER_NAME=admin in .env (do not use USER= — Linux USER overrides it)
    volumes:
      - serpbear_data:/app/data

volumes:
  serpbear_data:
